name: Fetch Market Data

on:
  schedule:
    - cron: '0 10 * * *'   # circa 11:00 Italia in inverno
    - cron: '0 22 * * *'   # circa 23:00 Italia in inverno giorni feriali
  workflow_dispatch:          # Esecuzione manuale dalla repo

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Fetch market data
        run: python scripts/fetch_market_data.py

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "RWM DataBot"
          git add data/market_data.json
          git diff --staged --quiet || git commit -m "📊 Market data update $(date +'%Y-%m-%d %H:%M')"
          git push
